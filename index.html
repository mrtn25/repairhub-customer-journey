<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepairHub – Customer Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c14;--card:#12151f;--card2:#181c29;--border:#252a3a;
  --blue:#3b82f6;--blue2:#1d4ed8;--green:#22c55e;--orange:#f97316;
  --red:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--radius:16px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* ── OUTER SHELL ── */
#shell{display:flex;width:100vw;height:100vh;overflow:hidden}

/* ── JOURNEY COLUMN ── */
#journey{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
  transition:flex .4s ease;
}
/* when panel is open, journey shrinks to 50% */
#shell.panel-open #journey{flex:0 0 50%;max-width:50%}

/* TOP BAR */
#topbar{width:100%;max-width:700px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-shrink:0}
#back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;transition:all .18s}
#back-btn:hover{background:var(--card2);color:var(--text);border-color:#3b82f6}
#back-btn:disabled{opacity:0;pointer-events:none}
.brand-logo{font-size:18px;font-weight:800;letter-spacing:-.5px}.brand-logo span{color:var(--blue)}
.brand-tag{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:3px 10px}
#topbar-right{display:flex;align-items:center;gap:8px}

/* OM TOGGLE BTN */
#om-toggle{
  background:var(--card);border:1px solid var(--border);color:var(--muted);
  border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:'Inter',sans-serif;
  display:flex;align-items:center;gap:5px;
  transition:all .18s;white-space:nowrap;
}
#om-toggle:hover,#om-toggle.active{
  background:rgba(59,130,246,.15);border-color:var(--blue);color:#93c5fd;
}

/* PROGRESS */
#progress-wrap{width:100%;max-width:700px;padding:0 20px 10px;flex-shrink:0}
.prog-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--muted)}
.prog-bar-bg{height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-bar-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}

/* SCENE IMAGE */
#scene-img-wrap{width:100%;max-width:700px;padding:0 20px;flex-shrink:0}
#scene-img{width:100%;height:auto;display:block;border-radius:14px;background:var(--card2);transition:opacity .4s ease}
#scene-img.hidden{opacity:0}

/* DOTS */
#dots{display:flex;gap:6px;justify-content:center;padding:10px 0 4px;flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .3s}
.dot.active{background:var(--blue);width:18px;border-radius:99px}
.dot.done{background:var(--green)}

/* SCROLL AREA */
#scroll-area{width:100%;max-width:700px;padding:0 20px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}

/* CARD */
#scene-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;transition:opacity .3s ease,transform .3s ease}
.om-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.28);border-radius:99px;padding:4px 12px;font-size:11px;color:#93c5fd;font-weight:600;letter-spacing:.3px;margin-bottom:10px}
.scene-title{font-size:21px;font-weight:800;line-height:1.25;margin-bottom:8px;letter-spacing:-.3px}
.scene-text{font-size:14px;line-height:1.7;color:var(--muted)}
.scene-text strong{color:var(--text)}
.info-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.6}
.info-box .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.info-box .row:last-child{border-bottom:none}
.info-box .row .lbl{color:var(--muted)}.info-box .row .val{font-weight:600}
.val-green{color:#22c55e}.val-orange{color:#f97316}.val-blue{color:#60a5fa}.val-red{color:#ef4444}
.repair-stages{display:flex;gap:6px;flex-wrap:wrap}
.stage{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.stage.active{background:#1d4ed8;border-color:#3b82f6;color:white}
.stage.done{background:#14532d;border-color:#22c55e;color:#86efac}
#choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{background:var(--card2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .18s;display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;width:100%}
.choice-btn:hover{background:var(--blue2);border-color:var(--blue);transform:translateX(3px)}
.choice-btn .em{font-size:20px;flex-shrink:0}
.choice-btn .tx .main{display:block;font-weight:600}
.choice-btn .tx .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.choice-btn:hover .tx .sub{color:#93c5fd}
.green-btn{background:#14532d;border-color:#22c55e}.green-btn:hover{background:#166534}

/* ── OM PANEL ── */
#om-panel{
  flex:0 0 0%;max-width:0;min-width:0;
  overflow:hidden;
  background:var(--card);
  border-left:1px solid transparent;
  display:flex;flex-direction:column;
  transition:flex .4s ease,max-width .4s ease,border-color .4s ease;
}
#shell.panel-open #om-panel{
  flex:0 0 50%;max-width:50%;
  border-left-color:var(--border);
}

/* inner wrapper — fixed width so content doesn't squish during animation */
#om-panel-inner{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  padding:20px 20px;
  overflow-y:auto;
  min-width:320px;
}

/* panel header */
.om-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0}
.om-panel-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.om-panel-title span{color:var(--blue)}
#om-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px;transition:color .15s}
#om-close:hover{color:var(--text)}

/* legend */
.om-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}

/* active node label */
#om-active-label{
  font-size:11.5px;color:#93c5fd;
  background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);
  border-radius:8px;padding:8px 12px;margin-bottom:16px;
  line-height:1.6;min-height:40px;transition:all .3s;
}

/* SVG flow — takes remaining space and scales */
#om-svg-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-bottom:12px}
svg#flow{width:100%;max-width:460px;height:auto;overflow:visible}

/* node states */
.n-idle .node-rect,.n-idle .node-tri,.n-idle .node-dia{fill:#181c29;stroke:#334155;stroke-width:1.5}
.n-active .node-rect,.n-active .node-tri,.n-active .node-dia{fill:#1d4ed8;stroke:#3b82f6;stroke-width:2.5}
.n-done .node-rect,.n-done .node-tri,.n-done .node-dia{fill:#14532d;stroke:#22c55e;stroke-width:1.5}
.n-branch-inactive{opacity:.3}

.node-label{font-family:'Inter',sans-serif;font-size:9.5px;fill:#94a3b8;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.n-active .node-label{fill:#fff;font-weight:700}
.n-done .node-label{fill:#86efac}

.flow-arrow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arr)}
.branch-pct{font-family:'Inter',sans-serif;font-size:9px;fill:#64748b;text-anchor:middle}

@media(max-width:860px){
  #shell.panel-open #om-panel{
    position:fixed;right:0;top:0;height:100vh;z-index:200;
    flex:0 0 90vw;max-width:90vw;
  }
  #shell.panel-open #journey{flex:1;max-width:100%}
}
</style>
</head>
<body>
<div id="shell">

  <!-- JOURNEY -->
  <div id="journey">
    <div id="topbar">
      <button id="back-btn" onclick="goBack()">← Back</button>

        <div class="brand-tag">Customer Journey · OM Capstone</div>
        <button id="om-toggle" onclick="toggleOM()">📐 Operations</button>

    <div id="scene-img-wrap">

        <div class="leg-item"><svg width="14" height="14"><polygon points="7,1 13,13 1,13" fill="#181c29" stroke="#334155" stroke-width="1.5"/></svg>Buffer (WIP)</div>
        <div class="leg-item"><svg width="14" height="14"><polygon points="7,1 13,7 7,13 1,7" fill="#181c29" stroke="#334155" stroke-width="1.5"/></svg>Decision</div>

      <div id="om-active-label">👋 Start the journey to see the process in action.</div>

          <line class="flow-arrow" x1="160" y1="380" x2="160" y2="408"/>

          <!-- 5. Decision -->

            <rect class="node-rect" x="108" y="482" width="104" height="38" rx="5"/>

let history=[],cur=0,omOpen=false;

const ALL_NODES=["n-arrival","n-tray","n-prexray","n-xray","n-decision","n-repairbuf","n-repair","n-qcbuf","n-pickup","n-manualbuf","n-manual"];
const NODE_MAP={
  start:    {active:null,done:[],branch:null},
  arrival:  {active:"n-arrival",done:[],branch:null},
  tray:     {active:"n-tray",done:["n-arrival"],branch:null},
  prexray:  {active:"n-prexray",done:["n-arrival","n-tray"],branch:null},
  xray:     {active:"n-xray",done:["n-arrival","n-tray","n-prexray"],branch:null},
  decision: {active:"n-decision",done:["n-arrival","n-tray","n-prexray","n-xray"],branch:null},
  repairbuf:{active:"n-repairbuf",done:["n-arrival","n-tray","n-prexray","n-xray","n-decision"],branch:"main"},
  repair:   {active:"n-repair",done:["n-arrival","n-tray","n-prexray","n-xray","n-decision","n-repairbuf"],branch:"main"},
  qcbuf:    {active:"n-qcbuf",done:["n-arrival","n-tray","n-prexray","n-xray","n-decision","n-repairbuf","n-repair"],branch:"main"},
  pickup:   {active:"n-pickup",done:["n-arrival","n-tray","n-prexray","n-xray","n-decision","n-repairbuf","n-repair","n-qcbuf"],branch:"main"},
  done:     {active:null,done:["n-arrival","n-tray","n-prexray","n-xray","n-decision","n-repairbuf","n-repair","n-qcbuf","n-pickup"],branch:"main"},
  manualbuf:{active:"n-manualbuf",done:["n-arrival","n-tray","n-prexray","n-xray","n-decision"],branch:"manual"},
  manual:   {active:"n-manual",done:["n-arrival","n-tray","n-prexray","n-xray","n-decision","n-manualbuf"],branch:"manual"},
  scheduled:{active:"n-decision",done:["n-arrival","n-tray","n-prexray","n-xray"],branch:null},
  leave:    {active:"n-decision",done:["n-arrival","n-tray","n-prexray","n-xray"],branch:null},
};

function updateOMDiagram(nodeKey){
  const map=NODE_MAP[nodeKey]||NODE_MAP.start;
  ALL_NODES.forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.classList.remove("n-active","n-done","n-branch-inactive");
    if(el.id===map.active) el.classList.add("n-active");
    else if(map.done.includes(el.id)) el.classList.add("n-done");
    else{
      el.classList.add("n-idle");
      if((el.id==="n-manualbuf"||el.id==="n-manual")&&map.branch==="main") el.classList.add("n-branch-inactive");
    }
  });
  const pos=NODE_POS[nodeKey]||NODE_POS.start;
  document.getElementById("flow-dot").setAttribute("cx",pos.cx);
  document.getElementById("flow-dot").setAttribute("cy",pos.cy);
  document.getElementById("om-active-label").innerHTML=S[cur].label||"";
  document.getElementById("om-sched-note").style.display=(nodeKey==="scheduled"?"block":"none");
}

function toggleOM(){
  omOpen=!omOpen;
  document.getElementById("shell").classList.toggle("panel-open",omOpen);
  document.getElementById("om-toggle").classList.toggle("active",omOpen);
  if(omOpen) updateOMDiagram(S[cur].node||"start");
}

function render(idx,dir){
  const sc=S[idx];
  const card=document.getElementById('scene-card');
  const choicesEl=document.getElementById('choices');
  card.style.opacity='0';card.style.transform=`translateY(${dir>0?'10px':'-10px'})`;
  setTimeout(()=>{
    let h='';
    if(sc.om) h+=`<div class="om-badge">📐 ${sc.om}</div>`;
    h+=`<div class="scene-title">${sc.title}</div><p class="scene-text">${sc.text}</p>`;
    if(sc.info){
      h+=`<div class="info-box" style="margin-top:12px">`;
      sc.info.forEach(r=>h+=`<div class="row"><span class="lbl">${r.l}</span><span class="val ${r.c}">${r.v}</span></div>`);
      h+=`</div>`;
    }
    if(sc.stages){
      h+=`<div class="repair-stages" style="margin-top:12px">`;
      sc.stages.forEach((s,i)=>{
        const c=i<sc.active?'done':i===sc.active?'active':'';
        h+=`<div class="stage ${c}">${s}</div>`;
      });
      h+=`</div>`;
    }
    card.innerHTML=h;
    let ch='';
    sc.choices.forEach(c=>{
      const cls=c.hi==='green'?'choice-btn green-btn':'choice-btn';
      ch+=`<button class="${cls}" onclick="go(${c.n},1)"><span class="em">${c.e}</span><span class="tx"><span class="main">${c.m}</span><span class="sub">${c.s}</span></span></button>`;
    });
    choicesEl.innerHTML=ch;
    const pct=Math.round((idx/(S.length-1))*100);
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('prog-step').textContent=`Step ${idx+1} of ${S.length}`;
    document.getElementById('prog-pct').textContent=pct+'%';
    const dotsEl=document.getElementById('dots');
    dotsEl.innerHTML='';
    S.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='dot'+(i===idx?' active':i<idx?' done':'');
      dotsEl.appendChild(d);
    });
    const imgEl=document.getElementById('scene-img');
    if(sc.img){imgEl.classList.add('hidden');imgEl.onload=()=>imgEl.classList.remove('hidden');imgEl.onerror=()=>imgEl.classList.add('hidden');imgEl.src=sc.img;}
    else{imgEl.src='';imgEl.classList.add('hidden');}
    document.getElementById('back-btn').disabled=(history.length===0);
    card.style.transition='opacity .3s ease,transform .3s ease';
    requestAnimationFrame(()=>{card.style.opacity='1';card.style.transform='translateY(0)';});
    document.getElementById('scroll-area').scrollTop=0;
    if(omOpen) updateOMDiagram(sc.node||"start");
  },250);
}

function go(idx,dir){history.push(cur);cur=idx;render(idx,dir);}
function goBack(){if(history.length===0)return;cur=history.pop();render(cur,-1);}
render(0,1);
</script>
