<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepairHub – Customer Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c14;--card:#12151f;--card2:#181c29;--border:#252a3a;
  --blue:#3b82f6;--blue2:#1d4ed8;--green:#22c55e;--orange:#f97316;
  --red:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--radius:16px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}

/* TOP BAR */
#topbar{width:100%;max-width:680px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-shrink:0}
#back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;transition:all .18s}
#back-btn:hover{background:var(--card2);color:var(--text);border-color:#3b82f6}
#back-btn:disabled{opacity:0;pointer-events:none}
.brand-logo{font-size:18px;font-weight:800;letter-spacing:-.5px}.brand-logo span{color:var(--blue)}
.brand-tag{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:3px 10px}

/* PROGRESS */
#progress-wrap{width:100%;max-width:680px;padding:0 20px 10px;flex-shrink:0}
.prog-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--muted)}
.prog-bar-bg{height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-bar-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .5s ease}

/* SCENE IMAGE — full natural height, no crop */
#scene-img-wrap{width:100%;max-width:680px;padding:0 20px;flex-shrink:0}
#scene-img{width:100%;height:auto;display:block;border-radius:14px;background:var(--card2);transition:opacity .4s ease}
#scene-img.hidden{opacity:0}

/* DOTS */
#dots{display:flex;gap:6px;justify-content:center;padding:10px 0 4px;flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .3s}
.dot.active{background:var(--blue);width:18px;border-radius:99px}
.dot.done{background:var(--green)}

/* SCROLL AREA */
#scroll-area{width:100%;max-width:680px;padding:0 20px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}

/* CARD */
#scene-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;transition:opacity .3s ease,transform .3s ease}
.om-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.28);border-radius:99px;padding:4px 12px;font-size:11px;color:#93c5fd;font-weight:600;letter-spacing:.3px;margin-bottom:10px}
.scene-title{font-size:21px;font-weight:800;line-height:1.25;margin-bottom:8px;letter-spacing:-.3px}
.scene-text{font-size:14px;line-height:1.7;color:var(--muted)}
.scene-text strong{color:var(--text)}

.info-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.6}
.info-box .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.info-box .row:last-child{border-bottom:none}
.info-box .row .lbl{color:var(--muted)}.info-box .row .val{font-weight:600}
.val-green{color:#22c55e}.val-orange{color:#f97316}.val-blue{color:#60a5fa}.val-red{color:#ef4444}

.repair-stages{display:flex;gap:6px;flex-wrap:wrap}
.stage{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.stage.active{background:#1d4ed8;border-color:#3b82f6;color:white}
.stage.done{background:#14532d;border-color:#22c55e;color:#86efac}

#choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{background:var(--card2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .18s;display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;width:100%}
.choice-btn:hover{background:var(--blue2);border-color:var(--blue);transform:translateX(3px)}
.choice-btn .em{font-size:20px;flex-shrink:0}
.choice-btn .tx .main{display:block;font-weight:600}
.choice-btn .tx .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.choice-btn:hover .tx .sub{color:#93c5fd}
.green-btn{background:#14532d;border-color:#22c55e}.green-btn:hover{background:#166534}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="back-btn" onclick="goBack()">← Back</button>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="brand-logo">Repair<span>Hub</span></div>
      <div class="brand-tag">Customer Journey · OM Capstone</div>
    </div>
  </div>

  <div id="progress-wrap">
    <div class="prog-label"><span id="prog-step">Step 1 of 9</span><span id="prog-pct">0%</span></div>
    <div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div id="scene-img-wrap">
    <img id="scene-img" src="" alt="scene" class="hidden" />
  </div>

  <div id="dots"></div>

  <div id="scroll-area">
    <div id="scene-card"></div>
    <div id="choices"></div>
  </div>

</div>
<script>
const BASE="https://raw.githubusercontent.com/mrtn25/repairhub-customer-journey/main/images/";
const S=[
{img:BASE+"scene1.jpeg",om:null,
title:"Oh no. Your phone just cracked.",
text:`You drop your phone and the screen shatters. <strong>No insurance, no backup.</strong> As a consultant you need it fixed today.<br><br>Luckily a friend texts you: <em>"There's this place downtown — RepairHub. Super fast, totally legit."</em>`,
choices:[{e:"🚶",m:"Head to RepairHub",s:"Let's see what this place is about",n:1}]},

{img:BASE+"scene2.jpeg",om:"OM: Arrival Queue (Buffer)",
title:"You arrive at RepairHub.",
text:`The store is clean and modern. A short queue forms at the entrance — this is the <strong>arrival buffer</strong>, holding customers until the counter is free.<br><br>You wait about <strong>3 minutes</strong>.`,
choices:[{e:"➡️",m:"Walk up to the counter",s:"It's your turn",n:2}]},

{img:BASE+"scene3.jpeg",om:"OM: Activity — Counter Registration",
title:"Place your phone under the camera.",
text:`The counter has a <strong>built-in camera and a touchscreen tablet</strong>. You place your cracked phone under the camera. It scans instantly.<br><br>You confirm on the tablet: <strong>Samsung Galaxy S24</strong>. Damage: <em>Cracked screen</em>. The AI cross-references the camera image with your selection.`,
choices:[{e:"✅",m:"Confirm: Samsung Galaxy S24, cracked screen",s:"System recognises your model automatically",n:3}]},

{img:BASE+"scene4.jpeg",om:"OM: AI Diagnosis + Inventory Check (ROP) + VUT Queueing",
title:"The AI is running its checks…",
text:`In seconds, the AI does three things internally:<br><br><strong>1.</strong> Identifies repair — screen replacement, ~55 min.<br><strong>2.</strong> Checks stock via <strong>Reorder Point (ROP)</strong> — part in stock ✅<br><strong>3.</strong> Calculates your wait using the <strong>VUT queueing model</strong>.`,
info:[{l:"Repair type",v:"Screen replacement",c:"val-blue"},{l:"Processing time",v:"55 min",c:""},{l:"Part in stock?",v:"✅ Yes (qty: 4)",c:"val-green"},{l:"Technicians available",v:"3 working",c:""},{l:"Queue wait (W_q)",v:"~18 min",c:"val-orange"},{l:"Estimated total",v:"~73 min",c:"val-orange"}],
choices:[{e:"👀",m:"See your quote",s:"The system now shows you the full offer",n:4}]},

{img:BASE+"scene4.jpeg",om:"OM: Single Customer Decision Point",
title:"Here's your personalised quote.",
text:`The tablet shows you the full offer. <strong>This is the only decision point in the process.</strong> What do you want to do?`,
info:[{l:"Repair",v:"Screen replacement — Samsung S24",c:"val-blue"},{l:"Price",v:"€ 129",c:""},{l:"Ready by",v:"Today ~14:45",c:"val-green"},{l:"Part",v:"In stock ✅",c:"val-green"},{l:"Warranty",v:"12 months",c:""}],
choices:[
  {e:"⚡",m:"Yes — fix it today!",s:"Same-day repair · ready ~14:45 · €129",n:5,hi:"green"},
  {e:"📅",m:"Book a future appointment",s:"Part reserved, replenishment triggered on confirmation",n:7},
  {e:"❌",m:"No thanks, I'll pass",s:"Leave without repair — lost demand for the process",n:8}
]},

{img:BASE+"scene6.jpeg",om:"OM: Repair Queue → Technician Activity → QC",
title:"Your phone is being repaired.",
text:`Your job enters the <strong>repair queue</strong>. A technician picks it up and gets to work. You grab a coffee nearby. SMS notification when it's done.<br><br>Technician replaces the screen module, runs diagnostics, then hands to quality control.`,
stages:["Repair Queue","Disassembly","Screen Replaced","QC & Test","Done ✅"],active:4,
choices:[{e:"🔔",m:"You got the SMS — pick up your phone!",s:"Quality control passed ✅",n:6}]},

{img:BASE+"scene7.jpeg",om:"OM: Pickup Buffer → Satisfied Demand",
title:"Your phone is fixed. Good as new.",
text:`You return to the store. Service advisor hands you your phone — <strong>screen perfect, warranty card inside</strong>. Total time walk-in to pickup: <strong>91 minutes</strong>.<br><br>Same-day promise: <strong>kept</strong>. You're back online.`,
info:[{l:"Walk-in time",v:"13:10",c:""},{l:"Queue wait",v:"18 min",c:"val-orange"},{l:"Repair time",v:"55 min",c:""},{l:"QC",v:"8 min",c:""},{l:"Pickup",v:"14:41",c:"val-green"},{l:"Total time",v:"91 min ✅",c:"val-green"},{l:"Cost",v:"€ 129",c:""}],
choices:[{e:"🔁",m:"Play again — try a different path",s:"Go back to the beginning",n:0,hi:"green"}]},

{img:BASE+"scene8.jpeg",om:"OM: Scheduled Repair — replenishment on confirmation only",
title:"Appointment booked. Part reserved.",
text:`You choose <strong>Thursday 10:00</strong>. The system reserves the part and triggers replenishment <strong>only now — because you confirmed.</strong><br><br>No wasted inventory. SMS confirmation + reminder the day before.`,
info:[{l:"Appointment",v:"Thursday 10:00",c:"val-blue"},{l:"Part reserved",v:"Samsung S24 screen ✅",c:"val-green"},{l:"Replenishment",v:"Triggered on confirmation",c:"val-orange"},{l:"Price",v:"€ 129 (locked in)",c:""}],
choices:[{e:"🔁",m:"Start over — try same-day path",s:"See what happens if you approve immediately",n:0}]},

{img:null,om:null,
title:"You walk away.",
text:`You decide not to go ahead. <strong>No part reserved, no technician time allocated.</strong><br><br>From an OM perspective: <em>lost demand</em> — the customer exits the process before entering it.`,
choices:[{e:"🔁",m:"Try again — maybe approve this time?",s:"Go back to the beginning",n:0}]},
];

let history=[];
let cur=0;

function render(idx,dir){
  const sc=S[idx];
  const card=document.getElementById('scene-card');
  const choicesEl=document.getElementById('choices');
  card.style.opacity='0';card.style.transform=`translateY(${dir>0?'10px':'-10px'})`;

  setTimeout(()=>{
    let h='';
    if(sc.om) h+=`<div class="om-badge">📐 ${sc.om}</div>`;
    h+=`<div class="scene-title">${sc.title}</div>`;
    h+=`<p class="scene-text">${sc.text}</p>`;
    if(sc.info){
      h+=`<div class="info-box" style="margin-top:12px">`;
      sc.info.forEach(r=>h+=`<div class="row"><span class="lbl">${r.l}</span><span class="val ${r.c}">${r.v}</span></div>`);
      h+=`</div>`;
    }
    if(sc.stages){
      h+=`<div class="repair-stages" style="margin-top:12px">`;
      sc.stages.forEach((s,i)=>{
        const c=i<sc.active?'done':i===sc.active?'active':'';
        h+=`<div class="stage ${c}">${s}</div>`;
      });
      h+=`</div>`;
    }
    card.innerHTML=h;

    let ch='';
    sc.choices.forEach(c=>{
      const cls=c.hi==='green'?'choice-btn green-btn':'choice-btn';
      ch+=`<button class="${cls}" onclick="go(${c.n},1)"><span class="em">${c.e}</span><span class="tx"><span class="main">${c.m}</span><span class="sub">${c.s}</span></span></button>`;
    });
    choicesEl.innerHTML=ch;

    const pct=Math.round((idx/(S.length-1))*100);
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('prog-step').textContent=`Step ${idx+1} of ${S.length}`;
    document.getElementById('prog-pct').textContent=pct+'%';

    const dotsEl=document.getElementById('dots');
    dotsEl.innerHTML='';
    S.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='dot'+(i===idx?' active':i<idx?' done':'');
      dotsEl.appendChild(d);
    });

    const imgEl=document.getElementById('scene-img');
    if(sc.img){
      imgEl.classList.add('hidden');
      imgEl.onload=()=>imgEl.classList.remove('hidden');
      imgEl.onerror=()=>imgEl.classList.add('hidden');
      imgEl.src=sc.img;
    } else {
      imgEl.src='';
      imgEl.classList.add('hidden');
    }

    document.getElementById('back-btn').disabled=(history.length===0);
    card.style.transition='opacity .3s ease,transform .3s ease';
    requestAnimationFrame(()=>{card.style.opacity='1';card.style.transform='translateY(0)'});
    document.getElementById('scroll-area').scrollTop=0;
  },250);
}

function go(idx,dir){
  history.push(cur);
  cur=idx;
  render(idx,dir);
}

function goBack(){
  if(history.length===0) return;
  cur=history.pop();
  render(cur,-1);
}

render(0,1);
</script>
</body>
</html>
